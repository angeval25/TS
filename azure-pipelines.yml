schedules:
- cron: "0 13 * * *"   # 8:00 AM hora Colombia (1:00 PM UTC)
  displayName: "8AM Colombia"
  branches:
    include:
    - main
  always: true

- cron: "0 21 * * *"   # 4:00 PM hora Colombia (9:00 PM UTC)
  displayName: "4PM Colombia"
  branches:
    include:
    - main
  always: true

- cron: "0 5 * * *"    # 12:00 AM hora Colombia (5:00 AM UTC)
  displayName: "12AM Colombia"
  branches:
    include:
    - main
  always: true

trigger: none  # Solo se dispara por schedule o manualmente

variables:
- group: JiraCredentials  # Grupo de Library con JIRA_SERVER, JIRA_EMAIL, JIRA_API_TOKEN, FIRST_RESPONSE_ASSIGNEES

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true  # Necesario para hacer git push al final

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.9'
  displayName: 'Set up Python 3.9'

- script: |
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    python3 -c "
    import os
    config_lines = []
    config_lines.append('JIRA_CONFIG = {')
    config_lines.append(f\"    'server': '{os.environ.get('JIRA_SERVER', '')}',\")
    config_lines.append(f\"    'email': '{os.environ.get('JIRA_EMAIL', '')}',\")
    config_lines.append(f\"    'api_token': '{os.environ.get('JIRA_API_TOKEN', '')}'\")
    config_lines.append('}')
    config_lines.append('')
    config_lines.append('# Lista de personas para First Response')
    import json, re
    assignees_str = os.environ.get('FIRST_RESPONSE_ASSIGNEES', '')
    if assignees_str:
        # Limpiar comillas, corchetes y espacios extra que puedan venir de Azure Library
        assignees_str = re.sub(r\"[\\[\\]'\\\"]\", '', assignees_str)
        assignees_list = [a.strip() for a in assignees_str.split(',') if a.strip()]
        config_lines.append(f'FIRST_RESPONSE_ASSIGNEES = {json.dumps(assignees_list, ensure_ascii=False)}')
        print(f'First Response Assignees configurados: {len(assignees_list)} personas')
    else:
        config_lines.append('# FIRST_RESPONSE_ASSIGNEES no configurado en secrets')
        config_lines.append('FIRST_RESPONSE_ASSIGNEES = []')
        print('Advertencia: FIRST_RESPONSE_ASSIGNEES no esta configurado')
    with open('config.py', 'w') as f:
        f.write('\n'.join(config_lines) + '\n')
    print('Config.py creado desde variables')
    "
  env:
    JIRA_SERVER: $(JIRA_SERVER)
    JIRA_EMAIL: $(JIRA_EMAIL)
    JIRA_API_TOKEN: $(JIRA_API_TOKEN)
    FIRST_RESPONSE_ASSIGNEES: $(FIRST_RESPONSE_ASSIGNEES)
  displayName: 'Configure Jira credentials'

- script: |
    echo "Obteniendo issues desde Jira..."
    echo "Fecha actual del sistema: $(date)"
    python3 obtener_issues_jql.py Libro1.xlsx 0
  env:
    JIRA_SERVER: $(JIRA_SERVER)
    JIRA_EMAIL: $(JIRA_EMAIL)
    JIRA_API_TOKEN: $(JIRA_API_TOKEN)
  displayName: 'Get issues from Jira'

- script: |
    echo "Verificando conexion con Jira..."
    python3 -c "
    from jira_integration import JiraIntegration
    try:
        jira = JiraIntegration()
        print(f'✓ Conexion establecida')
        print(f'✓ Tipo de Jira detectado: {jira.jira_type}')
        print(f'✓ Servidor: {jira.server}')
        test_issue = 'TPGSOC-1346774'
        changelog = jira.get_changelog(test_issue)
        print(f'✓ Changelog de prueba obtenido: {len(changelog)} cambios')
        if changelog:
            print('✓ La conexion y permisos estan funcionando correctamente')
        else:
            print('⚠ Advertencia: Changelog vacio (puede ser normal si el issue no tiene historial)')
    except Exception as e:
        print(f'✗ Error en conexion: {e}')
        import traceback
        traceback.print_exc()
        exit(1)
    "
  displayName: 'Verify Jira connection'

- script: |
    echo "Procesando XLSX para obtener fechas..."
    python3 procesar_csv.py || exit 1
    echo "Verificando que el archivo se actualizo..."
    python3 -c "from openpyxl import load_workbook; wb = load_workbook('Libro1.xlsx', data_only=True); ws = wb.active; print(f'Total issues en Excel: {ws.max_row - 1}')"
  displayName: 'Process XLSX and get dates'

- script: |
    git config user.email "azuredevops@pipeline.com"
    git config user.name "Azure DevOps Pipeline"
    git add Libro1.xlsx
    if git diff --staged --quiet; then
      echo "No hay cambios para commitear"
    else
      git commit -m "Auto-update: Process Jira issues $(date +'%Y-%m-%d %H:%M:%S UTC')"
      git push origin HEAD:$(Build.SourceBranchName)
    fi
  displayName: 'Commit and push changes'
